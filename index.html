<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HACKPACK // CYBERDECK ONLINE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
/* СТИЛИ */
*{
    margin:0; padding:0; box-sizing:border-box;
    user-select: none; -webkit-tap-highlight-color: transparent;
}

body{
    background:#020202; color:#d9f7ff;
    font-family: 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden;
}

.background-fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(64,167,227,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(64,167,227,.05) 1px, transparent 1px);
    background-size: 30px 30px; transform: perspective(500px) rotateX(60deg);
    transform-origin: top; opacity: 0.5;
}

.panel {
    width: 92%; max-width: 400px;
    background: linear-gradient(rgba(7, 10, 14, 0.8), rgba(7, 10, 14, 0.8)), url('ao.png');
    background-size: cover; background-position: center;
    border: 1px solid rgba(64, 167, 227, 0.4);
    border-radius: 24px; padding: 20px;
    position: relative; z-index: 10;
    backdrop-filter: blur(8px); overflow: hidden;
    box-shadow: 0 10px 50px rgba(0,0,0,0.8);
}

.top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 11px; font-weight: bold; }
.status-online { color: #4cd964; display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; background: #4cd964; border-radius: 50%; box-shadow: 0 0 8px #4cd964; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

.balance { font-size: 42px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 20px; text-shadow: 0 0 15px rgba(64,167,227,0.5); }
.balance span { color: #40a7e3; }

.info-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 15px; margin-bottom: 15px; }
.info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.info-val { color: #40a7e3; font-weight: bold; }

.content-area { height: 130px; overflow: hidden; font-family: monospace; font-size: 11px; color: #8fdfff; margin-bottom: 20px; border-top: 1px solid rgba(64,167,227,0.2); padding-top: 10px; }

/* СТИЛИ ДЛЯ ПОЛЯ ПАРОЛЯ */
.promo-box {
    display: flex; gap: 5px; margin-top: 10px;
}
.promo-input {
    flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(64,167,227,0.3);
    border-radius: 10px; padding: 8px; color: #fff; font-family: monospace; outline: none;
}
.promo-btn {
    background: #4cd964; color: #000; border: none; border-radius: 10px;
    padding: 0 15px; font-weight: bold; cursor: pointer;
}

.upgrade-btn {
    display: flex; justify-content: space-between;
    background: rgba(0,0,0,0.5); padding: 12px;
    border-radius: 12px; margin-bottom: 8px;
    border: 1px solid rgba(64, 167, 227, 0.3); cursor: pointer;
}

.actions { display: grid; gap: 10px; position: relative; z-index: 100; }
button { padding: 18px; border-radius: 16px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.1s; }
button:active { transform: scale(0.96); }

.btn-mine { background: #40a7e3; color: #fff; box-shadow: 0 4px 15px rgba(64,167,227,0.4); }
.btn-shop { background: rgba(22, 27, 34, 0.8); color: #40a7e3; border: 1px solid #40a7e3; }
.log-entry { margin-bottom: 3px; opacity: 0.9; }
</style>
</head>
<body>

<div class="background-fx"><div class="grid"></div></div>

<div class="panel">
    <div class="top-bar">
        <span>CYBERDECK v1.2</span>
        <div class="status-online"><div class="dot"></div> ONLINE: <span id="user-count">0</span></div>
    </div>

    <div class="balance"><span>⟠</span> <span id="hashes-val">0</span></div>

    <div class="info-box">
        <div class="info-row"><span>Auto-Mining:</span> <span class="info-val" id="rate-val">0 H/s</span></div>
        <div class="info-row"><span>Power:</span> <span class="info-val" id="click-val">+1</span></div>
    </div>

    <div class="content-area" id="main-content">
        <div id="logs-view"></div>
        <div id="shop-view" style="display:none;">
            <div class="upgrade-btn" id="buy-click">
                <span>[UPG] CLICK LVL <b id="c-lvl">1</b></span>
                <span id="c-cost" style="color:#4cd964">50 H</span>
            </div>
            <div class="upgrade-btn" id="buy-auto">
                <span>[UPG] BOT LVL <b id="a-lvl">0</b></span>
                <span id="a-cost" style="color:#4cd964">150 H</span>
            </div>
            <div class="promo-box">
                <input type="text" id="promo-input" class="promo-input" placeholder="ENTER ACCESS CODE...">
                <button id="promo-btn" class="promo-btn">OK</button>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-mine" id="mine-btn">MINE VIRTUAL HASH</button>
        <button class="btn-shop" id="shop-btn">UPGRADES SHOP</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAI5Jz37Zs8ggO_5QLXTYU5QR9geh0wpHM",
    authDomain: "games-hackpack.firebaseapp.com",
    databaseURL: "https://games-hackpack-default-rtdb.firebaseio.com", 
    projectId: "games-hackpack",
    storageBucket: "games-hackpack.firebasestorage.app",
    messagingSenderId: "765398567944",
    appId: "1:765398567944:web:0e5f86189f4947187995bd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const tg = window.Telegram.WebApp;
tg.expand();

let hashes = parseFloat(localStorage.getItem('h_save') || '0');
let clickLvl = parseInt(localStorage.getItem('c_lvl_save') || '1');
let autoLvl = parseInt(localStorage.getItem('a_lvl_save') || '0');
let inShop = false;

// ЛОГИКА ПАРОЛЯ
document.getElementById('promo-btn').onclick = () => {
    const code = document.getElementById('promo-input').value;
    if(code === 'hackpack1977') {
        if(!localStorage.getItem('promo_claimed')) {
            hashes += 1000000;
            localStorage.setItem('promo_claimed', 'true');
            tg.showAlert("ACCESS GRANTED: +1,000,000 HASHES!");
            updateUI();
        } else {
            tg.showAlert("ERROR: Code already used.");
        }
    } else {
        tg.showAlert("ERROR: Invalid access code.");
    }
    document.getElementById('promo-input').value = '';
};

function updateUI() {
    document.getElementById('hashes-val').textContent = Math.floor(hashes).toLocaleString();
    document.getElementById('rate-val').textContent = (autoLvl * 2) + ' H/s';
    document.getElementById('click-val').textContent = '+' + clickLvl;
    document.getElementById('c-lvl').textContent = clickLvl;
    document.getElementById('c-cost').textContent = Math.floor(50 * Math.pow(1.5, clickLvl-1)) + ' H';
    document.getElementById('a-lvl').textContent = autoLvl;
    document.getElementById('a-cost').textContent = Math.floor(150 * Math.pow(1.7, autoLvl)) + ' H';
    localStorage.setItem('h_save', hashes);
    localStorage.setItem('c_lvl_save', clickLvl);
    localStorage.setItem('a_lvl_save', autoLvl);
}

document.getElementById('mine-btn').onclick = () => {
    hashes += clickLvl;
    addLog(`Decrypted +${clickLvl} H`);
    updateUI();
    tg.HapticFeedback.impactOccurred('light');
};

document.getElementById('shop-btn').onclick = () => {
    inShop = !inShop;
    document.getElementById('logs-view').style.display = inShop ? 'none' : 'block';
    document.getElementById('shop-view').style.display = inShop ? 'block' : 'none';
    document.getElementById('shop-btn').textContent = inShop ? 'BACK TO LOGS' : 'UPGRADES SHOP';
};

document.getElementById('buy-click').onclick = () => {
    let cost = Math.floor(50 * Math.pow(1.5, clickLvl-1));
    if(hashes >= cost) { hashes -= cost; clickLvl++; updateUI(); }
};

document.getElementById('buy-auto').onclick = () => {
    let cost = Math.floor(150 * Math.pow(1.7, autoLvl));
    if(hashes >= cost) { hashes -= cost; autoLvl++; updateUI(); }
};

function addLog(txt) {
    if(inShop) return;
    const logBox = document.getElementById('logs-view');
    const l = document.createElement('div');
    l.className = 'log-entry';
    l.textContent = `> ${txt}`;
    logBox.prepend(l);
    if(logBox.children.length > 6) logBox.lastChild.remove();
}

// Счетчик онлайн (имитация для примера)
setInterval(() => {
    document.getElementById('user-count').textContent = Math.floor(Math.random() * (1500 - 1400) + 1400);
}, 3000);

setInterval(() => { if(autoLvl > 0) { hashes += (autoLvl * 2) / 10; updateUI(); } }, 100);

updateUI();
</script>
</body>
</html>
