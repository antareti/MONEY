<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKPACK // CYBERDECK // IDLE GAME</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select: none;
}

html{
    overflow-x:hidden;
}

body{
    background:#020202;
    color:#d9f7ff;
    font-family:Inter,system-ui,sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;

    overflow-x:hidden;
    overflow-y:auto;

    padding:20px;

    position:relative;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at top,#0f3d52 0%,transparent 40%),
        radial-gradient(circle at bottom,#07161d 0%,transparent 45%);

    opacity:.6;
    pointer-events:none;
}

.grid{
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(rgba(64,167,227,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64,167,227,.08) 1px, transparent 1px);

    background-size:40px 40px;

    transform:perspective(900px) rotateX(60deg);
    transform-origin:top;

    opacity:.18;
    pointer-events:none;
}

.scanline{
    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            transparent 50%,
            rgba(255,255,255,.02) 51%
        );

    background-size:100% 4px;
    mix-blend-mode:soft-light;
}

/* PANEL */

.panel{
    width:100%;
    max-width:420px;

    background:rgba(7,10,14,.88);

    border:1px solid rgba(64,167,227,.35);
    border-radius:26px;

    padding:24px;

    position:relative;

    backdrop-filter:blur(14px);

    box-shadow:
        0 0 50px rgba(64,167,227,.12),
        inset 0 0 20px rgba(64,167,227,.05);

    margin:auto;

    z-index:2;
}

.panel::after{
    content:"";

    position:absolute;
    inset:0;

    border-radius:26px;
    padding:1px;

    background:
        linear-gradient(
            135deg,
            rgba(64,167,227,.6),
            transparent
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.logo{
    font-size:14px;
    font-weight:900;
    letter-spacing:3px;
    color:#40a7e3;
}

.status{
    font-size:11px;
    color:#4cd964;

    display:flex;
    align-items:center;
    gap:7px;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#4cd964;
    box-shadow:0 0 10px #4cd964;

    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.3;
    }
}

/* BALANCE */

.balance-box{
    text-align:center;
    margin-bottom:24px;
}

.balance-label{
    color:#7d93a0;

    text-transform:uppercase;
    letter-spacing:2px;

    font-size:11px;

    margin-bottom:8px;
}

.balance{
    font-size:44px;
    font-weight:900;

    text-shadow:0 0 25px rgba(64,167,227,.35);

    word-break:break-word;
}

.balance span{
    color:#40a7e3;
}

/* CARDS */

.cards{
    display:grid;
    gap:12px;

    margin-bottom:18px;
}

.card{
    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.06);
    border-radius:16px;

    padding:14px;

    overflow:hidden;
}

.card-title{
    font-size:11px;
    color:#40a7e3;

    text-transform:uppercase;
    letter-spacing:1px;

    margin-bottom:10px;
}

.metric{
    display:flex;
    justify-content:space-between;

    margin-bottom:8px;

    font-size:13px;
}

.metric:last-child{
    margin-bottom:0;
}

/* BAR */

.bar{
    width:100%;
    height:8px;

    border-radius:20px;

    background:#0d1318;

    overflow:hidden;
}

.bar-fill{
    height:100%;
    width:15%;

    background:
        linear-gradient(
            90deg,
            #40a7e3,
            #7de2ff
        );

    box-shadow:0 0 18px rgba(64,167,227,.5);

    animation:move 3s infinite linear;
    transition: width 0.3s ease;
}

@keyframes move{
    0%{
        filter:hue-rotate(0deg);
    }

    100%{
        filter:hue-rotate(20deg);
    }
}

/* LOGS & UPGRADES */

.logs{
    height:130px;

    overflow:hidden;

    font-family:monospace;
    font-size:11px;

    color:#8fdfff;

    line-height:1.7;

    word-break:break-word;
}

.log-line{
    opacity:.85;
    animation:flicker .4s;
}

@keyframes flicker{
    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:.85;
        transform:none;
    }
}

/* Магазин улучшений */
.upgrade-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(64,167,227,0.06);
    border: 1px solid rgba(64,167,227,0.15);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: 0.2s;
}
.upgrade-item:last-child {
    margin-bottom: 0;
}
.upgrade-item:hover {
    background: rgba(64,167,227,0.12);
    border-color: rgba(64,167,227,0.3);
}
.upgrade-info {
    display: flex;
    flex-direction: column;
}
.up-name {
    font-size: 11px;
    font-weight: bold;
    color: #cfefff;
    text-transform: uppercase;
}
.up-desc {
    font-size: 10px;
    color: #7d93a0;
}
.up-cost {
    font-size: 12px;
    font-weight: 900;
    color: #40a7e3;
    font-family: monospace;
}

/* BUTTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:18px;
}

button{
    border:none;

    cursor:pointer;

    padding:15px;

    border-radius:16px;

    font-weight:800;

    transition:.2s;
}

button:active{
    transform:scale(.95);
}

.primary{
    background:#40a7e3;
    color:#fff;

    box-shadow:0 0 20px rgba(64,167,227,.3);
}

.secondary{
    background:#0f1317;
    color:#cfefff;

    border:1px solid rgba(64,167,227,.25);
}

/* FOOTER */

.footer{
    margin-top:18px;

    text-align:center;

    color:#5f717c;

    font-size:10px;
    letter-spacing:1px;

    line-height:1.6;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .panel{
        padding:18px;
        border-radius:22px;
    }

    .balance{
        font-size:36px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="grid"></div>
<div class="scanline"></div>

<div class="panel">

    <div class="top">

        <div class="logo">
            CYBERDECK v1.0
        </div>

        <div class="status">
            <div class="dot"></div>
            <span id="status-text">MINING NODE ACTIVE</span>
        </div>

    </div>

    <div class="balance-box">

        <div class="balance-label">
            Decrypted Cyber Hashes
        </div>

        <div class="balance">
            <span>⟠</span>
            <span id="power">0</span>
        </div>

    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title">
                Hardware Performance
            </div>

            <div class="metric">
                <span>Hash Rate (Auto)</span>
                <span id="hash-rate">0 H/s</span>
            </div>

            <div class="metric">
                <span>Click Power</span>
                <span id="click-power">+1 H</span>
            </div>

            <div class="bar">
                <div class="bar-fill" id="progress-bar"></div>
            </div>

        </div>

        <div class="card">

            <div class="card-title" id="feed-title">
                Terminal Live Logs
            </div>

            <!-- Контейнер логов игры -->
            <div class="logs" id="logs"></div>

            <!-- Магазин Апгрейдов -->
            <div class="logs" id="shop-container" style="display: none; height: 130px; flex-direction: column; overflow-y: auto;">
                <div class="upgrade-item" onclick="buyUpgrade('click')">
                    <div class="upgrade-info">
                        <span class="up-name">Quantum Click</span>
                        <span class="up-desc" id="click-lvl">Lvl 1 (Increases manual power)</span>
                    </div>
                    <div class="up-cost" id="click-cost">50 H</div>
                </div>
                <div class="upgrade-item" onclick="buyUpgrade('auto')">
                    <div class="upgrade-info">
                        <span class="up-name">AI Mining Rig</span>
                        <span class="up-desc" id="auto-lvl">Lvl 0 (Automates decryption)</span>
                    </div>
                    <div class="up-cost" id="auto-cost">150 H</div>
                </div>
            </div>

        </div>

    </div>

    <div class="actions">

        <button class="primary" id="btn-main" onclick="mineHashes()">
            MINE HASH
        </button>

        <button class="secondary" id="btn-mode" onclick="toggleShop()">
            UPGRADES SHOP
        </button>

    </div>

    <div class="footer">
        CYBERDECK IDLE GAME // 100% VIRTUAL PLAY MONEY
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

try{
    tg.expand();
    tg.setHeaderColor('#000000');
}catch(e){}

/* GAME STATE STATE */
let hashes = parseFloat(localStorage.getItem('idle_hashes') || '0');
let clickLevel = parseInt(localStorage.getItem('idle_click_lvl') || '1');
let autoLevel = parseInt(localStorage.getItem('idle_auto_lvl') || '0');

let isShopMode = false;
let audioCtx = null;

/* AUDIO SYNTHESIZER (WEB AUDIO API) */
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, type, duration, vol) {
    try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
}

function soundClick() { playTone(120, 'triangle', 0.08, 0.2); }
function soundUpgrade() { 
    playTone(440, 'sine', 0.05, 0.1);
    setTimeout(() => playTone(880, 'sine', 0.1, 0.1), 50);
}
function soundLog() { playTone(900, 'sine', 0.03, 0.02); }

/* SYSTEM LOGS ENGINE */
const logsElement = document.getElementById('logs');
const shopContainer = document.getElementById('shop-container');
const powerDisplay = document.getElementById('power');
const hashRateDisplay = document.getElementById('hash-rate');
const clickPowerDisplay = document.getElementById('click-power');
const btnMain = document.getElementById('btn-main');
const btnMode = document.getElementById('btn-mode');
const feedTitle = document.getElementById('feed-title');
const progressBar = document.getElementById('progress-bar');

const gameLogs = [
    'CRYPT > Scanning system blocks...',
    'NETWATCH > Proxy connection re-routed.',
    'KERNEL > Memory stack allocated successfully.',
    'AI > Predictive decryption sequence ready.',
    'MAIN > Tunneling through firewalls...',
    'NODE > Synchronization handshake accepted.'
];

function addGameLog(customText = null) {
    if (isShopMode) return;
    const div = document.createElement('div');
    div.className = 'log-line';
    const text = customText || gameLogs[Math.floor(Math.random() * gameLogs.length)];
    const time = new Date().toLocaleTimeString();
    div.textContent = '[' + time + '] ' + text;
    logsElement.prepend(div);

    while(logsElement.children.length > 6) {
        logsElement.removeChild(logsElement.lastChild);
    }
    if (!customText) soundLog();
}

/* COSTS & FORMULAS */
function getClickCost() { return Math.floor(50 * Math.pow(1.5, clickLevel - 1)); }
function getAutoCost() { return Math.floor(150 * Math.pow(1.6, autoLevel)); }
function getAutoDPS() { return autoLevel * 2; }

/* REFRESH INTERFACE */
function updateUI() {
    powerDisplay.textContent = Math.floor(hashes).toLocaleString();
    hashRateDisplay.textContent = getAutoDPS() + ' H/s';
    clickPowerDisplay.textContent = '+' + clickLevel + ' H';
    
    // Обновляем магазин
    document.getElementById('click-lvl').textContent = `Lvl ${clickLevel} (+${clickLevel} per click)`;
    document.getElementById('click-cost').textContent = getClickCost() + ' H';
    document.getElementById('auto-lvl').textContent = `Lvl ${autoLevel} (+${getAutoDPS()} H/s passive)`;
    document.getElementById('auto-cost').textContent = getAutoCost() + ' H';

    // Анимация полоски прогресса на основе накоплений до ближайшего апгрейда
    let cost = getClickCost();
    let percent = Math.min((hashes / cost) * 100, 100);
    progressBar.style.width = percent + '%';
}

/* CLlCK ACTION (MINING) */
function mineHashes() {
    soundClick();
    hashes += clickLevel;
    saveGame();
    addGameLog(`HASH > Successfully compiled (+${clickLevel})`);
    updateUI();
}

/* TOGGLE SHOP/LOGS */
function toggleShop() {
    soundClick();
    isShopMode = !isShopMode;
    if (isShopMode) {
        logsElement.style.display = 'none';
        shopContainer.style.display = 'flex';
        feedTitle.textContent = 'Hardware Upgrades Market';
        btnMode.textContent = 'BACK TO LIVE LOGS';
    } else {
        shopContainer.style.display = 'none';
        logsElement.style.display = 'block';
        feedTitle.textContent = 'Terminal Live Logs';
        btnMode.textContent = 'UPGRADES SHOP';
        refreshLogs();
    }
}

/* BUY UPGRADES */
function buyUpgrade(type) {
    if (type === 'click') {
        let cost = getClickCost();
        if (hashes >= cost) {
            hashes -= cost;
            clickLevel++;
            soundUpgrade();
        } else {
            try { tg.showAlert("⚠️ Insufficient Hashes!"); } catch(e) { alert("Insufficient Hashes!"); }
        }
    } else if (type === 'auto') {
        let cost = getAutoCost();
        if (hashes >= cost) {
            hashes -= cost;
            autoLevel++;
            soundUpgrade();
        } else {
            try { tg.showAlert("⚠️ Insufficient Hashes!"); } catch(e) { alert("Insufficient Hashes!"); }
        }
    }
    saveGame();
    updateUI();
}

function saveGame() {
    localStorage.setItem('idle_hashes', hashes);
    localStorage.setItem('idle_click_lvl', clickLevel);
    localStorage.setItem('idle_auto_lvl', autoLevel);
}

function refreshLogs() {
    logsElement.innerHTML = '';
    for(let i=0; i<4; i++) addGameLog("SYS > Operational node online.");
}

/* GAME TICK (LOOP) */
// Пассивный доход капает каждые 100мс для плавности
setInterval(() => {
    let passiveGain = getAutoDPS() / 10;
    if (passiveGain > 0) {
        hashes += passiveGain;
        saveGame();
        updateUI();
    }
}, 100);

// Случайные системные логи раз в 3 секунды
setInterval(() => {
    if (!isShopMode) addGameLog();
}, 3000);

/* START */
refreshLogs();
updateUI();

</script>

</body>
</html>
