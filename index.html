<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HACKPACK // CYBERDECK IDLE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ОСНОВНЫЕ НАСТРОЙКИ */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body{
    background:#020202;
    color:#d9f7ff;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* Чтобы не дергалось при кликах */
}

/* ФОНОВЫЕ ЭФФЕКТЫ (НИЖНИЙ СЛОЙ) */
.background-fx {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none; /* КРИТИЧНО: игнорирует клики */
}

.grid {
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(rgba(64,167,227,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64,167,227,.05) 1px, transparent 1px);
    background-size: 30px 30px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: top;
    opacity: 0.5;
}

.scanline {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(64,167,227,0.02) 50%);
    background-size: 100% 4px;
}

/* ИГРОВАЯ ПАНЕЛЬ (СРЕДНИЙ СЛОЙ) */
.panel {
    width: 92%;
    max-width: 400px;
    background: rgba(7, 10, 14, 0.95);
    border: 1px solid rgba(64, 167, 227, 0.4);
    border-radius: 24px;
    padding: 20px;
    position: relative;
    z-index: 10; /* Выше фона */
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/* ШАПКА */
.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.status { color: #4cd964; display: flex; align-items: center; gap: 5px; }
.dot { width: 6px; height: 6px; background: #4cd964; border-radius: 50%; box-shadow: 0 0 8px #4cd964; }

/* БАЛАНС */
.stats-container {
    text-align: center;
    margin-bottom: 20px;
}
.label { font-size: 10px; color: #7d93a0; text-transform: uppercase; margin-bottom: 5px; }
.balance { font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(64,167,227,0.5); }
.balance span { color: #40a7e3; }

/* КАРТОЧКИ ИНФО */
.info-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
}
.info-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.info-val { color: #40a7e3; font-weight: bold; }

/* ЛОГИ / МАГАЗИН */
.content-area {
    height: 120px;
    overflow: hidden;
    font-family: monospace;
    font-size: 11px;
    color: #8fdfff;
    margin-bottom: 20px;
}

.upgrade-btn {
    display: flex;
    justify-content: space-between;
    background: rgba(64,167,227,0.1);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 5px;
    border: 1px solid rgba(64,167,227,0.2);
}

/* КНОПКИ (ВЕРХНИЙ СЛОЙ) */
.actions {
    display: grid;
    gap: 10px;
    position: relative;
    z-index: 100; /* САМЫЙ ВЕРХНИЙ СЛОЙ */
}

button {
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, filter 0.2s;
    touch-action: manipulation; /* Оптимизация под тапы */
}

button:active { transform: scale(0.95); filter: brightness(1.2); }

.btn-mine {
    background: #40a7e3;
    color: #fff;
    box-shadow: 0 4px 15px rgba(64,167,227,0.4);
}

.btn-shop {
    background: #161b22;
    color: #40a7e3;
    border: 1px solid #40a7e3;
}

.log-entry { margin-bottom: 2px; opacity: 0.8; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 0.8; } }
</style>
</head>
<body>

<div class="background-fx">
    <div class="grid"></div>
    <div class="scanline"></div>
</div>

<div class="panel">
    <div class="top-bar">
        <span>CYBERDECK v1.1</span>
        <div class="status"><div class="dot"></div> ONLINE</div>
    </div>

    <div class="stats-container">
        <div class="label">Decrypted Hashes</div>
        <div class="balance"><span>⟠</span> <span id="hashes-val">0</span></div>
    </div>

    <div class="info-box">
        <div class="info-row"><span>Auto-Rate:</span> <span class="info-val" id="rate-val">0 H/s</span></div>
        <div class="info-row"><span>Click Power:</span> <span class="info-val" id="click-val">+1</span></div>
    </div>

    <div class="content-area" id="main-content">
        <div id="logs-view"></div>
        
        <div id="shop-view" style="display:none;">
            <div class="upgrade-btn" onclick="buy('click')">
                <span>[UPG] CLICK LVL <b id="c-lvl">1</b></span>
                <span id="c-cost" style="color:#4cd964">50 H</span>
            </div>
            <div class="upgrade-btn" onclick="buy('auto')">
                <span>[UPG] AUTO BOT <b id="a-lvl">0</b></span>
                <span id="a-cost" style="color:#4cd964">150 H</span>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-mine" id="mine-trigger">MINE HASH</button>
        <button class="btn-shop" id="shop-trigger">UPGRADES SHOP</button>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

// Данные
let hashes = parseFloat(localStorage.getItem('h_save') || '0');
let clickLvl = parseInt(localStorage.getItem('c_lvl_save') || '1');
let autoLvl = parseInt(localStorage.getItem('a_lvl_save') || '0');

let inShop = false;
let audioCtx = null;

// Звук
function beep(f, d) {
    try {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let v = audioCtx.createOscillator();
        let g = audioCtx.createGain();
        v.type = 'sine'; v.frequency.value = f;
        g.gain.value = 0.05; v.connect(g); g.connect(audioCtx.destination);
        v.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        v.stop(audioCtx.currentTime + d);
    } catch(e){}
}

function updateUI() {
    document.getElementById('hashes-val').textContent = Math.floor(hashes).toLocaleString();
    document.getElementById('rate-val').textContent = (autoLvl * 2) + ' H/s';
    document.getElementById('click-val').textContent = '+' + clickLvl;
    
    document.getElementById('c-lvl').textContent = clickLvl;
    document.getElementById('c-cost').textContent = Math.floor(50 * Math.pow(1.5, clickLvl-1)) + ' H';
    document.getElementById('a-lvl').textContent = autoLvl;
    document.getElementById('a-cost').textContent = Math.floor(150 * Math.pow(1.7, autoLvl)) + ' H';
    
    localStorage.setItem('h_save', hashes);
    localStorage.setItem('c_lvl_save', clickLvl);
    localStorage.setItem('a_lvl_save', autoLvl);
}

// КЛИК (МАЙНИНГ)
const mineBtn = document.getElementById('mine-trigger');
mineBtn.addEventListener('click', (e) => {
    e.preventDefault();
    hashes += clickLvl;
    beep(200, 0.1);
    addLog(`+${clickLvl} hash decrypted`);
    updateUI();
});

// ПЕРЕКЛЮЧАТЕЛЬ МАГАЗИНА
document.getElementById('shop-trigger').addEventListener('click', () => {
    inShop = !inShop;
    beep(400, 0.1);
    document.getElementById('logs-view').style.display = inShop ? 'none' : 'block';
    document.getElementById('shop-view').style.display = inShop ? 'block' : 'none';
    document.getElementById('shop-trigger').textContent = inShop ? 'BACK TO LOGS' : 'UPGRADES SHOP';
});

function buy(type) {
    if(type === 'click') {
        let cost = Math.floor(50 * Math.pow(1.5, clickLvl-1));
        if(hashes >= cost) { hashes -= cost; clickLvl++; beep(600, 0.2); }
    } else {
        let cost = Math.floor(150 * Math.pow(1.7, autoLvl));
        if(hashes >= cost) { hashes -= cost; autoLvl++; beep(600, 0.2); }
    }
    updateUI();
}

function addLog(txt) {
    if(inShop) return;
    const logBox = document.getElementById('logs-view');
    const l = document.createElement('div');
    l.className = 'log-entry';
    l.textContent = `> ${new Date().toLocaleTimeString()}: ${txt}`;
    logBox.prepend(l);
    if(logBox.children.length > 7) logBox.lastChild.remove();
}

// Авто-майнинг раз в секунду
setInterval(() => {
    if(autoLvl > 0) {
        hashes += (autoLvl * 2);
        updateUI();
    }
}, 1000);

// Инициализация
updateUI();
addLog("System initialized...");
addLog("Node connected to cluster...");

</script>
</body>
</html>
