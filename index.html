<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0e1621;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: linear-gradient(145deg, #1c2733, #151f2b);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .balance-label { color: #818d99; font-size: 14px; }
        .balance-value { font-size: 28px; font-weight: bold; margin: 5px 0; color: #40a7e3; }
        .btn {
            background-color: #248bcf;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); }
        .market-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2b3947;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="balance-label">REAL BALANCE</div>
        <div class="balance-value" id="balance">$12,450.75</div>
        <div style="color: #4cd964; font-size: 12px;">●  Funds Enabled</div>
    </div>

    <div class="card">
        <h3>Market Watchlist</h3>
        <div class="market-item">
            <span>Bitcoin</span>
            <span style="color: #4cd964;">$84,210.50</span>
        </div>
        <div class="market-item">
            <span>Ethereum</span>
            <span style="color: #ff3b30;">$3,250.20</span>
        </div>
    </div>

    <button class="btn" onclick="sendData()">Сделать ставку (Demo)</button>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на всё окно

        function sendData() {
            // Функция отправляет данные обратно боту в чат
            tg.sendData("Пользователь совершил сделку!");
        }
    </script>
</body>
</html>
