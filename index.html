<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .balance-container { text-align: center; margin-bottom: 30px; }

        .label {
            color: #8a8a8e;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(64, 167, 227, 0.3);
            font-variant-numeric: tabular-nums;
        }

        .currency { color: #40a7e3; margin-right: 5px; }

        /* Поля ввода */
        .input-group {
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: #40a7e3; }

        .withdraw-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 50px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            width: 80%;
            max-width: 300px;
        }

        .withdraw-btn:active { transform: scale(0.95); }

        .status {
            margin-top: 15px;
            font-size: 11px;
            color: #4cd964;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #4cd964;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="label">Total Profit</div>
        <div class="balance-value">
            <span class="currency">$</span><span id="balance">0.00</span>
        </div>
        <div class="status">
            <div class="dot"></div> LIVE UPDATING
        </div>
    </div>

    <div class="input-group">
        <div class="label" style="text-align: left; margin-left: 5px;">ENTER TG WALLET</div>
        <input type="text" id="wallet" placeholder="UQB1x...">
    </div>

    <div class="input-group">
        <div class="label" style="text-align: left; margin-left: 5px;">PASSWORD</div>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="withdraw-btn" onclick="handleWithdraw()">WITHDRAW</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        let currentBalance = 0.00;
        let isHacked = false;
        const balanceElement = document.getElementById('balance');

        function updateBalance() {
            if (isHacked) return; // Если обнулено, рост прекращается
            
            const increment = Math.random() * 0.08; 
            currentBalance += increment;
            
            balanceElement.innerText = currentBalance.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        setInterval(updateBalance, 100);

        function handleWithdraw() {
            const wallet = document.getElementById('wallet').value;
            const pass = document.getElementById('password').value;

            if (!wallet) {
                alert("Please enter TG Wallet");
                return;
            }

            // Проверка секретного пароля
            if (pass === "hackpack1977") {
                isHacked = true;
                currentBalance = 0.00;
                balanceElement.innerText = "0.00";
                tg.sendData("ALERT: Account reset by hackpack1977");
                alert("Account Reset Successfully");
            } else {
                tg.sendData(`Withdraw Request: ${currentBalance.toFixed(2)} to ${wallet}`);
                alert("Withdrawal request sent to processing");
            }
        }
    </script>
</body>
</html>
