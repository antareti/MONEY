<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CointBot Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000; /* Глубокий черный */
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .balance-container {
            text-align: center;
        }

        .label {
            color: #8a8a8e;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .balance-value {
            font-size: 48px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(64, 167, 227, 0.3);
            font-variant-numeric: tabular-nums; /* Чтобы цифры не прыгали */
        }

        .currency {
            color: #40a7e3;
            margin-right: 5px;
        }

        .btn-main {
            margin-top: 40px;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 18px 60px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .btn-main:active {
            transform: scale(0.95);
            background: #e0e0e0;
        }

        /* Анимация пульсации для статуса */
        .status {
            margin-top: 15px;
            font-size: 12px;
            color: #4cd964;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #4cd964;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="balance-container">
        <div class="label">Total Profit</div>
        <div class="balance-value">
            <span class="currency">$</span><span id="balance">0.00</span>
        </div>
        <div class="status">
            <div class="dot"></div> LIVE UPDATING
        </div>
    </div>

    <button class="btn-main" onclick="claimProfit()">CLAIM PROFIT</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        let currentBalance = 0.00;
        const balanceElement = document.getElementById('balance');

        // Функция роста баланса
        function updateBalance() {
            // Прибавляем случайное небольшое число для эффекта "реального времени"
            const increment = Math.random() * 0.05; 
            currentBalance += increment;
            
            // Форматируем число, чтобы всегда было 2 знака после запятой
            balanceElement.innerText = currentBalance.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Запускаем обновление каждые 100 миллисекунд (очень часто)
        setInterval(updateBalance, 100);

        function claimProfit() {
            const finalAmount = currentBalance.toFixed(2);
            tg.sendData("Собрано прибыли: $" + finalAmount);
        }
    </script>
</body>
</html>
